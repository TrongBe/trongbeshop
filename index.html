<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Trực Tuyến</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <h1>Học Tập Trực Tuyến</h1>
    </div>
  </header>

  <main class="container">
    <!-- View: Danh sách đề -->
    <div id="quizListView" class="view-section active">
      <h2 class="section-title">Danh sách bộ đề hiện có</h2>
      <div id="quizList" class="quiz-grid">
        <!-- Javascript sẽ tự động thêm các đề vào đây -->
      </div>
    </div>

    <!-- View: Đang làm bài -->
    <div id="activeQuizView" class="view-section">
      <div class="quiz-header">
        <button id="btnBackToMenu" class="btn btn-text">← Quay lại danh sách</button>
        <h2 id="currentQuizTitle" class="section-title quiz-title">Đang tải...</h2>
      </div>
      <form id="quizForm">
        <div id="questionsContainer">
          <!-- Javascript sẽ tự động thêm câu hỏi vào đây -->
        </div>
        <div class="quiz-footer">
          <button type="submit" class="btn btn-primary btn-large">Nộp Bài Ngay</button>
        </div>
      </form>
    </div>

    <!-- View: Kết quả -->
    <div id="resultView" class="view-section">
      <div class="result-card">
        <h2>Kết quả bài làm</h2>
        <div class="score-circle">
          <span id="scoreText">0/0</span>
        </div>
        <div class="result-details">
          <p>Số câu trả lời đúng: <strong id="correctCount" class="text-success">0</strong></p>
          <p>Số câu trả lời sai: <strong id="incorrectCount" class="text-danger">0</strong></p>
        </div>
        <div class="action-buttons">
          <button id="btnRetry" class="btn btn-outline">Làm Lại Đề Này</button>
          <button id="btnBackToMenuFromResult" class="btn btn-primary">Chọn Đề Khác</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
